server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: agriloop360-backend
  datasource:
    url: ${MYSQL_URL:jdbc:h2:mem:agriloop360;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    username: ${MYSQL_USER:sa}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: ${MYSQL_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000

logging:
  level:
    root: INFO
    com.agriloop360: DEBUG
